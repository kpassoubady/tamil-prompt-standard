<svg xmlns="http://www.w3.org/2000/svg" width="432pt" height="648pt" viewBox="0 0 432 648">
  <!--
    Left (even) pages — outer edge is the LEFT side.
    Vertical rule runs top-to-bottom, terminating into a
    fan arc pattern at the bottom-left corner.
    Arc pivot: (20, 648) — directly below the vertical line.
  -->

  <!-- Vertical rule, terminates at outer arc start -->
  <line x1="20" y1="54" x2="20" y2="583"
        stroke="#0066CC" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Top accent -->
  <line x1="14" y1="54" x2="26" y2="54"
        stroke="#0066CC" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="20" cy="60" r="2" fill="#0066CC" fill-opacity="0.45"/>

  <!-- Mid-page accent dot -->
  <circle cx="20" cy="324" r="2.5" fill="#0066CC" fill-opacity="0.3"/>

  <!-- ── Bottom-left corner fan ── -->
  <!-- Three quarter-circle arcs, all pivoting at (20, 648) -->

  <!-- Outer arc  r=65 -->
  <path d="M 20,583 A 65,65 0 0 1 85,648"
        fill="none" stroke="#0066CC" stroke-width="0.75" stroke-opacity="0.22"/>

  <!-- Middle arc  r=45 -->
  <path d="M 20,603 A 45,45 0 0 1 65,648"
        fill="none" stroke="#0066CC" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Inner arc  r=25 -->
  <path d="M 20,623 A 25,25 0 0 1 45,648"
        fill="none" stroke="#0066CC" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Dots at arc starts (left edge junction) -->
  <circle cx="20" cy="583" r="2"   fill="#0066CC" fill-opacity="0.3"/>
  <circle cx="20" cy="603" r="2"   fill="#0066CC" fill-opacity="0.35"/>
  <circle cx="20" cy="623" r="2.5" fill="#0066CC" fill-opacity="0.45"/>

  <!-- Dots at arc ends (bottom edge) -->
  <circle cx="85" cy="648" r="1.5" fill="#0066CC" fill-opacity="0.2"/>
  <circle cx="65" cy="648" r="1.5" fill="#0066CC" fill-opacity="0.28"/>
  <circle cx="45" cy="648" r="2"   fill="#0066CC" fill-opacity="0.38"/>

  <!--
    Kolam-inspired dot cluster in the inner corner pocket.
    4 outer dots + 1 central dot — a traditional kolam seed pattern.
  -->
  <circle cx="29" cy="634" r="1.5" fill="#0066CC" fill-opacity="0.42"/>
  <circle cx="36" cy="634" r="1.5" fill="#0066CC" fill-opacity="0.42"/>
  <circle cx="29" cy="641" r="1.5" fill="#0066CC" fill-opacity="0.42"/>
  <circle cx="36" cy="641" r="1.5" fill="#0066CC" fill-opacity="0.42"/>
  <circle cx="32" cy="637" r="2"   fill="#0066CC" fill-opacity="0.35"/>
</svg>
