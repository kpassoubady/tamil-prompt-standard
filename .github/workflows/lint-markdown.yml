name: Lint and Fix Markdown

on:
  push:
    branches: [master, main]
    paths: ['**/*.md']
  pull_request:
    branches: [master, main]
    paths: ['**/*.md']

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run markdownlint with fixes
        run: npx markdownlint --fix "**/*.md"

      - name: Check for changes
        id: verify-changed-files
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "kangs2000@gmail.com"
          git config --local user.name "Kangeyan Passoubady"
          git add "prompts/**/*.md" "*.md" ".agent/**/*.md" ".github/**/*.md" ".cursor/**/*.md" ".windsurf/**/*.md"
          git commit -m "fix: auto-fix markdown linting issues (MD022, MD026, etc.)"
          git push
